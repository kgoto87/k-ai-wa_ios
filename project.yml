name: KAiWaMemo
options:
  deploymentTarget:
    iOS: 16.0
targets:
  KAiWaMemo:
    type: application
    platform: iOS
    sources:
      - path: KAiWaMemo/KAiWaMemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.KAiWaMemo
        GENERATE_INFOPLIST_FILE: YES
      info:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.754146169351-apcnr4n1jsshpnla0r91ctb37ksnvl2t
    dependencies:
      - package: Firebase
  KAiWaMemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KAiWaMemo/KAiWaMemoTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KAiWaMemo
  KAiWaMemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KAiWaMemo/KAiWaMemoUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: KAiWaMemo
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 10.25.0
